<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 140" width="760" height="140" fill="none">
  <defs>
    <linearGradient id="hRingGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#F3F0FA"/>
      <stop offset="25%" stop-color="#D0BFFB"/>
      <stop offset="55%" stop-color="#A78BFA"/>
      <stop offset="85%" stop-color="#6747A1"/>
      <stop offset="100%" stop-color="#191722"/>
    </linearGradient>

    <linearGradient id="hGoldOrbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A88236"/>
      <stop offset="30%" stop-color="#D5B16D"/>
      <stop offset="60%" stop-color="#FDF1D3"/>
      <stop offset="100%" stop-color="#D5B16D"/>
    </linearGradient>

    <radialGradient id="hSatGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FCEFD0"/>
      <stop offset="60%" stop-color="#D5B16D"/>
      <stop offset="100%" stop-color="#805C1E"/>
    </radialGradient>

    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Emblem Mark (Center around x=70, y=70) -->
  <g transform="translate(0, 0)">
    <!-- Background Orbit -->
    <g transform="rotate(-28 70 70)">
      <path d="M 22 70 A 48 13 0 0 1 118 70" stroke="url(#hGoldOrbitGrad)" stroke-width="2" stroke-opacity="0.45" fill="none"/>
    </g>

    <!-- Planetary Ring -->
    <path d="M 70 33 C 90 33 104 49 104 70 C 104 91 90 107 70 107 C 50 107 36 91 36 70 C 36 49 50 33 70 33 Z M 70 46 C 56 46 48 57 48 70 C 48 83 56 94 70 94 C 84 94 92 83 92 70 C 92 57 84 46 70 46 Z" 
          fill="url(#hRingGrad)" 
          filter="url(#hGlow)"/>

    <!-- Foreground Orbit -->
    <g transform="rotate(-28 70 70)">
      <path d="M 118 70 A 48 13 0 0 1 22 70" stroke="url(#hGoldOrbitGrad)" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      <path d="M 118 70 A 48 13 0 0 1 48 80" stroke="#FFE7B0" stroke-width="1.0" stroke-linecap="round" fill="none" opacity="0.8"/>
    </g>

    <!-- Satellite Orb -->
    <g filter="url(#hGlow)">
      <circle cx="107" cy="47" r="7" fill="#D5B16D" opacity="0.25"/>
      <circle cx="107" cy="47" r="5.5" fill="url(#hSatGrad)"/>
      <circle cx="105.5" cy="45.5" r="1.6" fill="#FFFFFF" opacity="0.85"/>
    </g>

    <!-- Axis Hairlines -->
    <line x1="70" y1="42" x2="70" y2="98" stroke="#A78BFA" stroke-width="0.6" stroke-opacity="0.45"/>
    <line x1="46" y1="70" x2="94" y2="70" stroke="#A78BFA" stroke-width="0.6" stroke-opacity="0.45"/>

    <!-- Central Star -->
    <path d="M 70 60 Q 70 70 80 70 Q 70 70 70 80 Q 70 70 60 70 Q 70 70 70 60 Z" fill="#F3F0FA"/>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="145" y1="36" x2="145" y2="104" stroke="#A5A1B5" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Right Typography Group -->
  <g transform="translate(170, 0)">
    <!-- ORBITAL Wordmark with Custom Star in 'A' -->
    <g transform="translate(0, 36)">
      <!-- O -->
      <path d="M 19 0 C 30 0 38 9 38 21 C 38 33 30 42 19 42 C 8 42 0 33 0 21 C 0 9 8 0 19 0 Z M 19 5.5 C 11.5 5.5 6 12 6 21 C 6 30 11.5 36.5 19 36.5 C 26.5 36.5 32 30 32 21 C 32 12 26.5 5.5 19 5.5 Z" fill="#F3F0FA"/>
      
      <!-- R -->
      <path d="M 58 1 L 76 1 C 86 1 92 6 92 14 C 92 20 87 24 81 25.5 L 93 42 L 86 42 L 75 27 L 64 27 L 64 42 L 58 42 Z M 64 6.5 L 75 6.5 C 81.5 6.5 86 9.5 86 14 C 86 18.5 81.5 21.5 75 21.5 L 64 21.5 Z" fill="#F3F0FA"/>
      
      <!-- B -->
      <path d="M 112 1 L 129 1 C 137 1 143 4.5 143 11 C 143 15 140 18 135 19.5 C 141 21 145 25 145 30 C 145 37.5 138 42 129 42 L 112 42 Z M 118 6.5 L 128 6.5 C 134 6.5 137 9 137 12.5 C 137 16 134 18.5 128 18.5 L 118 18.5 Z M 118 23.5 L 129 23.5 C 135 23.5 139 26 139 30 C 139 34 135 36.5 129 36.5 L 118 36.5 Z" fill="#F3F0FA"/>
      
      <!-- I -->
      <rect x="166" y="1" width="6" height="41" fill="#F3F0FA"/>
      
      <!-- T -->
      <path d="M 188 1 L 222 1 L 222 6.5 L 208 6.5 L 208 42 L 202 42 L 202 6.5 L 188 6.5 Z" fill="#F3F0FA"/>
      
      <!-- A with Star Sparkle Accent Inset -->
      <g transform="translate(236, 0)">
        <path d="M 18 1 L 34 42 L 27.5 42 L 22.8 30 L 13.2 30 L 8.5 42 L 2 42 L 18 1 Z M 18 13 L 14.8 25 L 21.2 25 Z" fill="#F3F0FA"/>
        <!-- Star accent in A -->
        <path d="M 18 20 Q 18 23.5 20.5 23.5 Q 18 23.5 18 27 Q 18 23.5 15.5 23.5 Q 18 23.5 18 20 Z" fill="#D5B16D"/>
      </g>
      
      <!-- L -->
      <path d="M 288 1 L 294 1 L 294 36.5 L 316 36.5 L 316 42 L 288 42 Z" fill="#F3F0FA"/>
    </g>

    <!-- Subtitle: AUTONOMOUS SPACE MISSION INTELLIGENCE & TELEMETRY CONSOLE -->
    <text x="2" y="103" 
          font-family="'Inter', -apple-system, sans-serif" 
          font-size="10.5" 
          font-weight="500" 
          letter-spacing="3.2" 
          fill="#A5A1B5">
      AUTONOMOUS SPACE MISSION INTELLIGENCE &amp; TELEMETRY CONSOLE
    </text>
  </g>
</svg>
